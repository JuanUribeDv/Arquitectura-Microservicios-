<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de cursos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/styles.css" />
  <link rel="stylesheet" href="../../css/pages/admin.css" />
  <script type="importmap">
    {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"}}
  </script>
</head>
<body class="role-admin">
  <button class="boton-volver" type="button" onclick="if (history.length > 1) history.back();">Volver</button>
  <div class="encabezado">
    <h1>Gestión de cursos <span class="etiqueta-rol">administrador</span></h1>
    <button class="salir" id="logoutButton" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='/index.html';">Cerrar sesión</button>
  </div>
  <main>
    <form class="formulario-inline" id="formulario-curso">
      <div>
        <label for="nombre">Nombre del curso</label>
        <input type="text" id="nombre" required />
      </div>
      <div>
        <label for="docenteUid">UID del docente</label>
        <input type="text" id="docenteUid" required />
      </div>
      <div>
        <label for="creditos">Créditos</label>
        <input type="number" id="creditos" min="0" />
      </div>
      <button type="submit">Crear curso</button>
    </form>
    <form class="formulario-inline" id="formulario-asignacion">
      <div>
        <label for="cursoSeleccionado">Materia</label>
        <select id="cursoSeleccionado" required><option value="">Cargando materias...</option></select>
      </div>
      <div>
        <label for="docenteSeleccionado">Docente</label>
        <select id="docenteSeleccionado" required><option value="">Cargando docentes...</option></select>
      </div>
      <button type="submit">Asignar docente</button>
    </form>
    <p class="mensaje-error" id="mensaje-error"></p>

    <table>
      <thead>
        <tr><th>Nombre</th><th>Docente</th><th>Créditos</th></tr>
      </thead>
      <tbody id="cuerpo-tabla-cursos"></tbody>
    </table>
  </main>

  <script type="module">
    import { signOut } from "firebase/auth";
    import { auth } from "../../js/config/firebaseConfig.js";
    import { requireRole } from "../../js/auth/authGuard.js";
    import { getCourses, createCourse, assignCourseTeacher } from "../../js/services/coursesApi.js";
    import { getUsers } from "../../js/services/usersApi.js";
    let cursos = [];

    async function cargarCursos() {
      cursos = await getCourses();
      const cuerpo = document.getElementById("cuerpo-tabla-cursos");
      cuerpo.innerHTML = cursos
        .map((c) => `<tr><td>${c.name || c.nombre}</td><td>${c.teacherUid || c.docenteUid}</td><td>${c.credits ?? c.creditos ?? 0}</td></tr>`)
        .join("");
      document.getElementById("cursoSeleccionado").innerHTML = cursos.length
        ? cursos.map((curso) => `<option value="${curso.id}">${curso.name || curso.nombre}</option>`).join("")
        : "<option value=\"\">No hay materias</option>";
    }

    async function cargarDocentes() {
      const usuarios = await getUsers();
      const docentes = usuarios.filter((usuario) => usuario.role === "docente");
      document.getElementById("docenteSeleccionado").innerHTML = docentes.length
        ? docentes.map((docente) => `<option value="${docente.uid}">${docente.displayName || docente.email}</option>`).join("")
        : "<option value=\"\">No hay docentes</option>";
    }

    document.getElementById("formulario-curso").addEventListener("submit", async (e) => {
      e.preventDefault();
      const mensajeError = document.getElementById("mensaje-error");
      mensajeError.textContent = "";
      try {
        await createCourse({
            nombre: document.getElementById("nombre").value,
            teacherUid: document.getElementById("docenteUid").value,
            creditos: Number(document.getElementById("creditos").value) || 0,
        });
        e.target.reset();
        await cargarCursos();
      } catch (err) {
        mensajeError.textContent = err.message;
      }
    });

    document.getElementById("formulario-asignacion").addEventListener("submit", async (event) => {
      event.preventDefault();
      const mensaje = document.getElementById("mensaje-error");
      mensaje.className = "mensaje-error";
      try {
        await assignCourseTeacher(document.getElementById("cursoSeleccionado").value, document.getElementById("docenteSeleccionado").value);
        mensaje.className = "mensaje-exito";
        mensaje.textContent = "Docente asignado correctamente";
        await cargarCursos();
      } catch (error) {
        mensaje.textContent = error.message;
      }
    });

    if (requireRole("admin")) {
      document.getElementById("logoutButton").addEventListener("click", async () => { await signOut(auth); localStorage.removeItem("currentUser"); window.location.href = "../../index.html"; });
      Promise.all([cargarCursos(), cargarDocentes()]).catch((err) => { document.getElementById("mensaje-error").textContent = err.message; });
    }
  </script>
</body>
</html>
