<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel del administrador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/styles.css" />
  <link rel="stylesheet" href="../../css/pages/admin.css" />
  <script type="importmap">
    {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"}}
  </script>
</head>
<body class="role-admin">
  <div class="encabezado">
    <h1>Panel del administrador <span class="etiqueta-rol">administrador</span></h1>
    <button class="salir" id="logoutButton" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='/index.html';">Cerrar sesión</button>
  </div>
  <main>
    <p>Administra la oferta académica y consulta los cursos registrados.</p>
    <div class="dashboard-grid">
      <a class="panel-link" href="cursos.html"><strong>Gestión de cursos</strong><span>Crear y consultar cursos</span></a>
      <a class="panel-link" href="usuarios.html"><strong>Usuarios</strong><span>Consultar usuarios del sistema</span></a>
    </div>
  </main>

  <script type="module">
    import { signOut } from "firebase/auth";
    import { auth } from "../../js/config/firebaseConfig.js";
    import { requireRole } from "../../js/auth/authGuard.js";
    if (requireRole("admin")) document.getElementById("logoutButton").addEventListener("click", async () => { await signOut(auth); localStorage.removeItem("currentUser"); window.location.href = "../../index.html"; });
  </script>
</body>
</html>
