<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Docente</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <link rel="stylesheet" href="../../css/pages/docente.css" />
    <script type="importmap">
      {"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"}}
    </script>
  </head>
  <body class="role-docente">
    <button class="boton-volver" type="button" onclick="if (history.length > 1) history.back();">Volver</button>
    <header class="encabezado">
      <h1>Panel del docente <span class="etiqueta-rol">docente</span></h1>
      <button class="salir" id="logoutButton" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='/index.html';">Cerrar sesión</button>
    </header>
    <main>
      <p>Consulta tus cursos y registra las calificaciones de tus estudiantes.</p>
      <div class="dashboard-grid">
        <a class="panel-link" href="mis-cursos.html"><strong>Mis cursos</strong><span>Revisar cursos asignados</span></a>
        <a class="panel-link" href="calificar.html"><strong>Registrar calificaciones</strong><span>Guardar una calificación</span></a>
      </div>
    </main>
    <script type="module">
      import { signOut } from "firebase/auth";
      import { auth } from "../../js/config/firebaseConfig.js";
      import { requireRole } from "../../js/auth/authGuard.js";
      if (requireRole("docente")) document.getElementById("logoutButton").addEventListener("click", async () => { await signOut(auth); localStorage.removeItem("currentUser"); window.location.href = "../../index.html"; });
    </script>
  </body>
</html>
